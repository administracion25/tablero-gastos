                    {activeTab === 'prorrateos' && (
                        <div className="flex flex-col gap-6 animate-fadeIn">
                            <div className="bg-purple-50 p-6 rounded-2xl border border-purple-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h2 className="text-xl font-black text-purple-900 flex items-center gap-2"><IconSplit /> Motor de Prorrateos Automáticos</h2>
                                    <p className="text-purple-700 text-sm mt-1">Crea reglas para dividir facturas generales porcentualmente entre locales.</p>
                                </div>
                                <button onClick={() => setIsNewProrrateoModalOpen(true)} className="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-lg flex items-center justify-center gap-2 font-bold shadow-md w-full md:w-auto">
                                    <IconPlus /> Crear Nueva Regla
                                </button>
                            </div>

                            <div className="grid grid-cols-1 gap-6">
                                {prorrateoRules.length === 0 && (
                                    <div className="text-center p-12 bg-white rounded-2xl border border-dashed border-slate-300">
                                        <p className="text-slate-400 font-medium">No tienes reglas de prorrateo configuradas.</p>
                                    </div>
                                )}
                                {prorrateoRules.map(rule => (
                                    <div key={rule.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                            <div>
                                                <h3 className="text-lg font-black text-slate-800">{rule.concept}</h3>
                                                <p className="text-xs font-bold text-slate-500 uppercase mt-1">{rule.category} • {rule.type}</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => handleEditProrrateoRule(rule)} className="text-blue-600 hover:bg-blue-50 px-3 py-2 rounded-lg font-bold text-sm bg-white shadow-sm border border-slate-200"><IconEdit /> Editar</button>
                                                <button onClick={() => handleDeleteProrrateoRule(rule.id)} className="text-red-500 hover:bg-red-50 px-3 py-2 rounded-lg font-bold text-sm"><IconTrash /> Borrar</button>
                                            </div>
                                        </div>
                                        <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div>
                                                <h4 className="text-xs font-bold text-slate-400 uppercase mb-3">Distribución Fija</h4>
                                                <div className="space-y-2">
                                                    {Object.entries(rule.percentages).map(([pdv, pct]) => parseFloat(pct) > 0 && (
                                                        <div key={pdv} className="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
                                                            <span className="font-semibold text-slate-700 text-sm">{pdv}</span>
                                                            <span className="font-black text-purple-600 text-sm">{pct}%</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="bg-blue-50/50 p-5 rounded-xl border border-blue-100 flex flex-col justify-center items-center text-center">
                                                <div className="bg-blue-100 p-3 rounded-full text-blue-600 mb-3"><IconList /></div>
                                                <h4 className="text-sm font-bold text-blue-800 mb-2">Vinculado a Planilla</h4>
                                                <p className="text-xs text-blue-600 leading-relaxed">Esta regla aparece automáticamente en la pestaña <b>Planilla</b> para ser pagada mes a mes.</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* VISTA: CONFIGURACIÓN */}
                    {activeTab === 'config' && (
                        <div className="flex flex-col gap-6 animate-fadeIn">
                            <div className="bg-slate-800 p-6 rounded-2xl shadow-sm text-white">
                                <h2 className="text-xl font-black flex items-center gap-2"><IconSettings /> Configuración del Sistema</h2>
                                <p className="text-slate-400 text-sm mt-1">Administra Puntos de Venta y Categorías base.</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-5 border-b border-slate-100 bg-slate-50"><h3 className="font-bold text-slate-800">Categorías de Gasto</h3></div>
                                    <div className="p-5">
                                        <form onSubmit={handleAddCategory} className="flex gap-2 mb-4">
                                            <input type="text" value={newCategory} onChange={e=>setNewCategory(e.target.value)} placeholder="Nueva categoría..." className="border border-slate-200 rounded p-2 flex-1 text-sm outline-none focus:border-blue-500" required />
                                            <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-blue-700">Agregar</button>
                                        </form>
                                        <ul className="divide-y divide-slate-100">
                                            {categories.map(cat => (
                                                <li key={cat} className="py-3 flex justify-between items-center group">
                                                    <span className="font-semibold text-slate-600 text-sm">{cat}</span>
                                                    <button onClick={()=>handleDeleteCategory(cat)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><IconTrash /></button>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-5 border-b border-slate-100 bg-slate-50"><h3 className="font-bold text-slate-800">Puntos de Venta (CC)</h3></div>
                                    <div className="p-5">
                                        <form onSubmit={handleAddPdv} className="flex gap-2 mb-4">
                                            <input type="text" value={newPdv} onChange={e=>setNewPdv(e.target.value)} placeholder="Nuevo PDV..." className="border border-slate-200 rounded p-2 flex-1 text-sm outline-none focus:border-blue-500" required />
                                            <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-blue-700">Agregar</button>
                                        </form>
                                        <ul className="divide-y divide-slate-100">
                                            {pdvs.map(pdv => (
                                                <li key={pdv} className="py-3 flex justify-between items-center group">
                                                    <span className="font-semibold text-slate-600 text-sm">{pdv}</span>
                                                    <button onClick={()=>handleDeletePdv(pdv)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100"><IconTrash /></button>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}


                    {/* --- MODALES --- */}

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fadeIn no-print">
                            <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="text-xl font-black text-slate-800">{editingId ? 'Editar Manual' : 'Nuevo Gasto Manual'}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-800"><IconX /></button>
                                </div>
                                <form onSubmit={saveExpense} className="p-6 text-slate-700">
                                    <div className="grid grid-cols-2 gap-5 mb-5">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Mes</label>
                                            <input type="month" required className="w-full border border-slate-300 rounded-lg p-3 font-medium outline-none focus:border-blue-500" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Monto ($)</label>
                                            <input type="number" required min="0" step="0.01" className="w-full border border-slate-300 rounded-lg p-3 font-bold text-lg outline-none focus:border-blue-500" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="mb-5">
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Concepto</label>
                                        <input type="text" required className="w-full border border-slate-300 rounded-lg p-3 font-medium outline-none focus:border-blue-500" value={formData.concept} onChange={e => setFormData({...formData, concept: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-5 mb-5">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Categoría</label>
                                            <select required className="w-full border border-slate-300 rounded-lg p-3 font-medium outline-none focus:border-blue-500 bg-white" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>
                                                {categories.map(c => <option key={c} value={c} className="bg-white">{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Tipo</label>
                                            <select required className="w-full border border-slate-300 rounded-lg p-3 font-medium outline-none focus:border-blue-500 bg-white" value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})}>
                                                {EXPENSE_TYPES.map(t => <option key={t} value={t} className="bg-white">{t}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="mb-8">
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Punto de Venta</label>
                                        <select required className="w-full border border-slate-300 rounded-lg p-3 font-medium outline-none focus:border-blue-500 bg-white" value={formData.pdv} onChange={e => setFormData({...formData, pdv: e.target.value})}>
                                            {pdvs.map(p => <option key={p} value={p} className="bg-white">{p}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex justify-end gap-3 pt-5 border-t border-slate-100">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-6 py-3 font-bold text-slate-500 hover:bg-slate-100 rounded-xl">Cancelar</button>
                                        <button type="submit" className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl">Guardar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {isNewProrrateoModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fadeIn no-print">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
                                <div className="p-6 border-b border-slate-100 bg-purple-50 flex justify-between items-center">
                                    <h3 className="text-xl font-black text-purple-900">{editingProrrateoId ? 'Editar Regla' : 'Nueva Regla'}</h3>
                                    <button onClick={() => { setIsNewProrrateoModalOpen(false); setEditingProrrateoId(null); }} className="text-slate-400 hover:text-slate-800"><IconX /></button>
                                </div>
                                <form onSubmit={handleSaveProrrateoRule} className="p-6">
                                    <div className="mb-5">
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Nombre del Servicio</label>
                                        <input type="text" required className="w-full border border-slate-300 rounded-lg p-3 font-bold text-slate-800 outline-none focus:border-purple-500" value={prorrateoFormData.concept} onChange={e => setProrrateoFormData({...prorrateoFormData, concept: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-5 mb-5">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Categoría</label>
                                            <select required className="w-full border border-slate-300 rounded-lg p-3 outline-none bg-white" value={prorrateoFormData.category} onChange={e => setProrrateoFormData({...prorrateoFormData, category: e.target.value})}>
                                                {categories.map(c => <option key={c} value={c} className="bg-white">{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Tipo</label>
                                            <select required className="w-full border border-slate-300 rounded-lg p-3 outline-none bg-white" value={prorrateoFormData.type} onChange={e => setProrrateoFormData({...prorrateoFormData, type: e.target.value})}>
                                                {EXPENSE_TYPES.map(t => <option key={t} value={t} className="bg-white">{t}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="mb-8">
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-3 border-b pb-2">Distribución (Debe sumar 100%)</label>
                                        <div className="space-y-3">
                                            {pdvs.map(pdv => (
                                                <div key={pdv} className="flex items-center gap-3">
                                                    <span className="flex-1 text-sm font-semibold text-slate-700">{pdv}</span>
                                                    <div className="relative w-24">
                                                        <input type="number" min="0" max="100" className="w-full border border-slate-300 rounded p-2 pr-8 text-right font-bold text-purple-700 outline-none focus:border-purple-500" value={prorrateoFormData.percentages[pdv] || ''} onChange={e => setProrrateoFormData({ ...prorrateoFormData, percentages: { ...prorrateoFormData.percentages, [pdv]: e.target.value } })} />
                                                        <span className="absolute right-3 top-2.5 font-bold text-slate-400">%</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-3 pt-5 border-t border-slate-100">
                                        <button type="button" onClick={() => { setIsNewProrrateoModalOpen(false); setEditingProrrateoId(null); }} className="px-6 py-3 font-bold text-slate-500 hover:bg-slate-100 rounded-xl">Cancelar</button>
                                        <button type="submit" className="px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-black rounded-xl">Guardar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {mixedPaymentRowId && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fadeIn no-print">
                            <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="text-lg font-black text-slate-800 flex items-center gap-2"><IconSplit /> Dividir Pago (Mixto)</h3>
                                    <button onClick={() => setMixedPaymentRowId(null)} className="text-slate-400 hover:text-slate-800"><IconX /></button>
                                </div>
                                <div className="p-6 text-slate-700">
                                    {(() => {
                                        const row = gridData.find(r => r.id === mixedPaymentRowId);
                                        const totalAmount = parseFloat(row?.amount || 0);
                                        const currentTotal = (parseFloat(mixedData.a1) || 0) + (parseFloat(mixedData.a2) || 0);
                                        const diff = totalAmount - currentTotal;

                                        return (
                                            <>
                                                <div className="bg-blue-50 p-3 rounded-lg mb-5 flex justify-between items-center border border-blue-100">
                                                    <span className="text-sm font-bold text-blue-800">Monto Total de Fila:</span>
                                                    <span className="text-lg font-black text-blue-900">{formatCurrency(totalAmount)}</span>
                                                </div>

                                                <div className="grid grid-cols-2 gap-4 mb-4">
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Medio 1</label>
                                                        <select className="w-full border border-slate-300 rounded p-2 text-sm outline-none bg-white" value={mixedData.m1} onChange={e => setMixedData({...mixedData, m1: e.target.value})}>
                                                            <option value="" disabled className="bg-white text-slate-800">Seleccionar...</option>
                                                            {PAYMENT_METHODS.map(m => <option key={m} value={m} className="bg-white text-slate-800">{m}</option>)}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Monto 1</label>
                                                        <input type="number" step="0.01" className="w-full border border-slate-300 rounded p-2 text-sm outline-none text-right font-bold bg-white" value={mixedData.a1} onChange={e => {
                                                            const a1 = e.target.value;
                                                            const a2 = totalAmount - (parseFloat(a1) || 0);
                                                            setMixedData({...mixedData, a1, a2: a2 > 0 ? a2.toFixed(2) : ''});
                                                        }} />
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-2 gap-4 mb-6">
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Medio 2</label>
                                                        <select className="w-full border border-slate-300 rounded p-2 text-sm outline-none bg-white" value={mixedData.m2} onChange={e => setMixedData({...mixedData, m2: e.target.value})}>
                                                            <option value="" disabled className="bg-white text-slate-800">Seleccionar...</option>
                                                            {PAYMENT_METHODS.map(m => <option key={m} value={m} className="bg-white text-slate-800">{m}</option>)}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Monto 2</label>
                                                        <input type="number" step="0.01" className="w-full border border-slate-300 rounded p-2 text-sm outline-none text-right font-bold bg-white" value={mixedData.a2} onChange={e => setMixedData({...mixedData, a2: e.target.value})} />
                                                    </div>
                                                </div>

                                                {Math.abs(diff) > 0.01 && (
                                                    <p className="text-xs font-bold text-red-500 mb-4 text-center bg-red-50 p-2 rounded border border-red-100">La suma de los montos no coincide con el total. <br/>Diferencia: {formatCurrency(diff)}</p>
                                                )}

                                                <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
                                                    <button onClick={() => setMixedPaymentRowId(null)} className="px-5 py-2 font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition-colors">Cancelar</button>
                                                    <button onClick={() => {
                                                        if (Math.abs(diff) > 0.01) return alert("Los montos no cuadran con el total. Revisa la suma.");
                                                        if (!mixedData.m1 || !mixedData.m2) return alert("Debes seleccionar dos medios de pago.");
                                                        handleFixedChange(row.id, row.concept, { paymentMethod: 'Mixto', mixedPayments: mixedData });
                                                        setMixedPaymentRowId(null);
                                                    }} className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl shadow-sm transition-colors">Confirmar División</button>
                                                </div>
                                            </>
                                        );
                                    })()}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
